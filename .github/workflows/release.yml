name: Build and Release Chrome Extension (.crx)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'updates.xml'
  workflow_dispatch:

jobs:
  build_release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install crx packager
        run: npm install -g crx

      - name: Get release metadata
        run: |
          RELEASE_VERSION="$(date -u +'%Y.%-m.%-d').${GITHUB_RUN_NUMBER}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          COMMIT_SUMMARY=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b | tr '\n' ' ' | tr -s ' ')
          echo "COMMIT_SUMMARY=$COMMIT_SUMMARY" >> $GITHUB_ENV
          echo "COMMIT_BODY=$COMMIT_BODY" >> $GITHUB_ENV

      - name: Set extension version
        run: node -e "const fs=require('fs'); const p='manifest.json'; const m=JSON.parse(fs.readFileSync(p)); m.version=process.env.RELEASE_VERSION; m.update_url='https://raw.githubusercontent.com/'+process.env.GITHUB_REPOSITORY+'/main/updates.xml'; fs.writeFileSync(p, JSON.stringify(m, null, 2)+'\\n');"

      - name: Pack extension to CRX
        id: pack
        run: |
          KEY_FILE="$RUNNER_TEMP/extension-key.pem"
          echo "$SIGNING_KEY" > "$KEY_FILE"
          crx pack ./ -o Off-Youtube-Bullshit.crx -p "$KEY_FILE"
          PUBLIC_KEY_HASH=$(openssl pkey -in "$KEY_FILE" -pubout -outform DER | sha256sum | cut -c1-32)
          EXTENSION_ID=$(python3 -c 'import sys; print("".join(chr(97 + int(n, 16)) for n in sys.argv[1]))' "$PUBLIC_KEY_HASH")
          echo "extension_id=$EXTENSION_ID" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
        with:
          tag: ${{ env.RELEASE_VERSION }}
          name: "Release ${{ env.RELEASE_VERSION }} - ${{ env.COMMIT_SUMMARY }}"
          body: ${{ env.COMMIT_BODY != '' && env.COMMIT_BODY || env.COMMIT_SUMMARY }}
          draft: false
          prerelease: false
          artifacts: Off-Youtube-Bullshit.crx
          artifactContentType: application/x-chrome-extension
          generateReleaseNotes: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update extension update manifest
        shell: bash
        run: |
          cat > updates.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="${{ steps.pack.outputs.extension_id }}">
              <updatecheck codebase="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/Off-Youtube-Bullshit.crx" version="${RELEASE_VERSION}" />
            </app>
          </gupdate>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update extension update manifest to ${RELEASE_VERSION}"
            git push
          fi
